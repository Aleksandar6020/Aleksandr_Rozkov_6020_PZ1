<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manuls</title>
</head>
<body>

<h1>All Manuls</h1>

<ul>
    <li th:each="manul : ${manuls}">
        <a th:href="@{/manuls/{id}(id=${manul.id})}" th:text="${manul.name}"></a><span th:text="${manul.name}"></span>
    </li>
</ul>

<a href="/">Home</a>

</body>
</html>
