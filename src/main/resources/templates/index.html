<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manul Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container hero">
    <section class="heroText">
        <p class="eyebrow">Pallas's cat blog platform</p>
        <h1>Manul Blog Platform</h1>

            <a class="button buttonSecondary" href="/register">Create account</a>
        </div>
    </section>
</main>

</html>
