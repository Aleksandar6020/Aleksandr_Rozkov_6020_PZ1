<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Register</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container narrow">
    <h1>Register</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form class="form" action="/register" method="post">
        <div class="formRow"><label class="label" for="email">Email</label><input id="email" class="input" type="email" name="email" required></div>
        <div class="formRow"><label class="label" for="password">Password</label><input id="password" class="input" type="password" name="password" required></div>
        <button class="button" type="submit">Register</button>
    </form>
</main>
</body>
</html>
